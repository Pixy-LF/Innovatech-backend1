name: Deploy Innovatech Backend

on:
  push:
    branches:
      - deploy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java y Maven
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend:latest

  deploy-to-ec2:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue remoto en AWS EC2 vía SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}          
          username: ubuntu                       
          key: ${{ secrets.EC2_SSH_KEY }}       
          script: |
            echo "Conectado exitosamente a AWS EC2. Iniciando actualización..."
            
            # 1. Nos movemos a la carpeta del proyecto en el servidor
            cd /home/ubuntu/Innovatech-backend1 || mkdir -p /home/ubuntu/Innovatech-backend1 && cd /home/ubuntu/Innovatech-backend1
            
            # 2. Descargamos los últimos cambios (el nuevo docker-compose)
            git pull origin deploy || true
            
            # 3. Bajamos los contenedores anteriores y limpiamos basura para no llenar el disco
            docker compose down
            docker system prune -f
            
            # 4. Descargamos la nueva imagen armada y levantamos el stack en segundo plano
            docker compose pull
            docker compose up -d --build
            
            echo "¡Innovatech Despacho Backend actualizado y corriendo con éxito!"