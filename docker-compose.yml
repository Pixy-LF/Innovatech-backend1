version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innovatech-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/innovatech_db
      - SPRING_DATASOURCE_USERNAME=devops_user
      - SPRING_DATASOURCE_PASSWORD=InnovatechSecure2026!
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres-db:
        condition: service_healthy 
    networks:
      - innovatech-net

  postgres-db:
    image: postgres:15-alpine
    container_name: innovatech-db
    environment:
      - POSTGRES_DB=innovatech_db
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=InnovatechSecure2026!
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d innovatech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovatech-net

networks:
  innovatech-net:
    driver: bridge 

volumes:
  db-data:
    driver: local 